<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiadora XAU</title>

  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <a class="whatsapp-float"
     href="https://wa.me/573108558080"
     target="_blank">
     WhatsApp
  </a>

  <section class="hero">

    <div class="hero-left">
      <span class="tag">
        Copy Trading • XAUUSD • Automatización
      </span>

      <h1>
        Conecta tu cuenta y copia operaciones automáticamente
      </h1>

      <p>
        Sistema profesional de copy trading para XAUUSD con ejecución automatizada,
        gestión optimizada y soporte personalizado vía WhatsApp.
      </p>

      <div class="hero-buttons">
        <a href="https://wa.me/573108558080" target="_blank" class="btn-primary">
          Ir a WhatsApp
        </a>

        <a href="#registro" class="btn-secondary">
          Solicitar acceso
        </a>
      </div>
    </div>

    <div class="hero-right">

      <img
        src="https://images.unsplash.com/photo-1642104704074-907c0698cbd9?q=80&w=1200&auto=format&fit=crop"
        alt="Trading Bot">

      <form id="registro-form">

        <h2>Formulario de registro</h2>

        <input
          type="text"
          name="nombre"
          placeholder="Nombre"
          required>

        <input
          type="text"
          name="whatsapp"
          placeholder="WhatsApp"
          required>

        <input
          type="email"
          name="email"
          placeholder="Correo electrónico"
          required>

        <input
          type="text"
          name="capital"
          placeholder="Capital inicial"
          required>

        <textarea
          name="mensaje"
          placeholder="Mensaje"
          required></textarea>

        <button type="submit">
          Registrarme ahora
        </button>

      </form>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
