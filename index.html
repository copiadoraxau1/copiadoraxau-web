<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiadora XAU</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#020b1f;
      color:white;
    }

    .container{
      display:flex;
      min-height:100vh;
      flex-wrap:wrap;
    }

    .left{
      flex:1;
      padding:60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .tag{
      background:#16a8ff;
      display:inline-block;
      padding:12px 24px;
      border-radius:30px;
      margin-bottom:30px;
      font-size:14px;
    }

    h1{
      font-size:70px;
      line-height:1.1;
      margin-bottom:20px;
    }

    p{
      font-size:20px;
      color:#d4d4d4;
      max-width:600px;
    }

    .right{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .card{
      background:#08142f;
      border-radius:20px;
      overflow:hidden;
      width:100%;
      max-width:600px;
    }

    .card img{
      width:100%;
      height:350px;
      object-fit:cover;
    }

    .form{
      padding:30px;
    }

    .form h2{
      margin-bottom:20px;
      font-size:32px;
    }

    input{
      width:100%;
      padding:16px;
      margin-bottom:15px;
      border:none;
      border-radius:10px;
      background:#12203f;
      color:white;
      font-size:16px;
    }

    button{
      width:100%;
      padding:16px;
      background:#1fb6ff;
      border:none;
      border-radius:10px;
      color:white;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      opacity:0.9;
    }

    @media(max-width:900px){
      .container{
        flex-direction:column;
      }

      h1{
        font-size:45px;
      }

      .left{
        padding:30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <div class="tag">
        Copy Trading · XAUUSD · Automatización
      </div>

      <h1>
        Conecta tu cuenta y copia operaciones automáticamente
      </h1>

      <p>
        Sistema profesional de copy trading para XAUUSD con ejecución automatizada y soporte personalizado.
      </p>
    </div>

    <div class="right">

      <div class="card">

        <img src="https://images.unsplash.com/photo-1642104704074-907c0698cbd9?q=80&w=1200&auto=format&fit=crop" alt="Trading">

        <div class="form">

          <h2>Formulario de registro</h2>

          <form action="https://formsubmit.co/copiadoraxau@gmail.com" method="POST">

            <input 
              type="text" 
              name="nombre" 
              placeholder="Nombre completo"
              required
            >

            <input 
              type="text" 
              name="whatsapp" 
              placeholder="WhatsApp"
              required
            >

            <input 
              type="email" 
              name="email" 
              placeholder="Correo electrónico"
              required
            >

            <input 
              type="hidden" 
              name="_subject" 
              value="Nuevo registro Copiadora XAU"
            >

            <input 
              type="hidden" 
              name="_captcha" 
              value="false"
            >

            <button type="submit">
              Registrarme
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
