<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiadora XAU</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#020b1f;
      color:white;
    }

    .container{
      display:flex;
      min-height:100vh;
      flex-wrap:wrap;
    }

    .left{
      flex:1;
      padding:60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .tag{
      background:#1dafff;
      padding:12px 25px;
      border-radius:30px;
      display:inline-block;
      margin-bottom:30px;
      font-size:15px;
      width:max-content;
    }

    h1{
      font-size:72px;
      line-height:1.05;
      margin-bottom:25px;
      font-weight:800;
    }

    p{
      color:#d5d5d5;
      font-size:22px;
      max-width:650px;
      line-height:1.5;
    }

    .right{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .card{
      width:100%;
      max-width:620px;
      background:#08142f;
      border-radius:24px;
      overflow:hidden;
    }

    .card img{
      width:100%;
      height:360px;
      object-fit:cover;
    }

    .form-area{
      padding:35px;
    }

    .form-area h2{
      font-size:42px;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:18px;
      margin-bottom:18px;
      border:none;
      border-radius:12px;
      background:#132344;
      color:white;
      font-size:16px;
    }

    input::placeholder{
      color:#9aa6c7;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:12px;
      background:#1dafff;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      opacity:0.9;
    }

    @media(max-width:900px){

      .container{
        flex-direction:column;
      }

      .left{
        padding:35px;
      }

      h1{
        font-size:48px;
      }

      p{
        font-size:18px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="left">

      <div class="tag">
        Copy Trading · XAUUSD · Automatización
      </div>

      <h1>
        Conecta tu cuenta y copia operaciones automáticamente
      </h1>

      <p>
        Sistema profesional de copy trading para XAUUSD con ejecución automatizada y soporte personalizado.
      </p>

    </div>

    <div class="right">

      <div class="card">

        <img 
          src="https://images.unsplash.com/photo-1674027392884-75180f56db4b?q=80&w=1200&auto=format&fit=crop" 
          alt="Bot Trading"
        >

        <div class="form-area">

          <h2>Formulario de registro</h2>

          <form action="https://formsubmit.co/copiadoraxau@gmail.com" method="POST">

            <input 
              type="text" 
              name="nombre"
              placeholder="Nombre completo"
              required
            >

            <input 
              type="text" 
              name="whatsapp"
              placeholder="WhatsApp"
              required
            >

            <input 
              type="email" 
              name="email"
              placeholder="Correo electrónico"
              required
            >

            <input 
              type="hidden" 
              name="_subject" 
              value="Nuevo registro Copiadora XAU"
            >

            <input 
              type="hidden" 
              name="_captcha" 
              value="false"
            >

            <button type="submit">
              Registrarme
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
